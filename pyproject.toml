[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diarrhizer"
version = "0.1.0"
description = "Local Windows tool for processing call recordings"
readme = "README.md"
# <3.13: whisperx 3.3.1 declares Requires-Python <3.13 and torch 2.3.1 has no wheels for newer Pythons.
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
    {name = "Diarrhizer Team"}
]
dependencies = [
    "torch>=2.3.0,<2.4.0",
    "torchaudio>=2.3.0,<2.4.0",
    "whisperx==3.3.1",
    "huggingface-hub<1.0",
    "numpy<2.0",
    "setuptools<81",
]

[project.optional-dependencies]
bench = [
    # Optional OS process-tree RAM/CPU and driver-wide GPU telemetry for tools/ benchmarks.
    "psutil>=5.9,<8",
    "nvidia-ml-py>=12,<14",
]
cuda = [
    # Compatibility extra; use the constrained CUDA install documented in README.
    # The CUDA wheel index is provided by requirements/cuda-cu121.txt.
]
gui = [
    "PySide6>=6.6,<6.12",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
diarrhizer = "diarrhizer.cli:main"
diarrhizer-gui = "diarrhizer_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
diarrhizer = "src/diarrhizer"
diarrhizer_gui = "src/diarrhizer_gui"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
