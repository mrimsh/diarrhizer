name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            pyproject.toml
      - name: Install supported CPU stack
        run: python -m pip install -c requirements/constraints-stable.txt -r requirements/base.txt -r requirements/cpu.txt -e '.[gui,dev]'
      - run: python -m pip check
      - run: python tools/check_repository.py
      - run: python -m pytest -q --tb=short
      - run: python -m diarrhizer doctor --profile export
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - name: Smoke installed wheel outside checkout
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/diarrhizer-*.whl).FullName
          python -m pip install --force-reinstall --no-deps $wheel
          Push-Location $env:RUNNER_TEMP
          python -m diarrhizer doctor --profile export
          if ($LASTEXITCODE -ne 0) { throw 'Installed wheel smoke failed' }
          python "$env:GITHUB_WORKSPACE/tools/smoke_wheel.py"
          if ($LASTEXITCODE -ne 0) { throw 'Installed wheel GUI smoke failed' }
          Pop-Location
